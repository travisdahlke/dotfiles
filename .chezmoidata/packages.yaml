packages:
  darwin:
    taps: []
    brews:
      - "age" # simple, modern and secure file encryption tool
      - "bat" # cat clone with syntax highlighting and Git integration
      - "eza" # modern replacement for 'ls'
      - "fd" # simple, fast and user-friendly alternative to 'find'
      - "fzf" # command-line fuzzy finder
      - "git-delta" # syntax-highlighting pager for git and diff output
      - "git" # distributed version control system
      - "jq" # command-line JSON processor
      - "mise" # polyglot runtime manager
      - "nvim": # highly configurable text editor
      - "ripgrep" # line-oriented search tool
      - "starship" # cross-shell prompt
      - "tmux" # terminal multiplexer
      - "zoxide" # modern alternative to z and autojump
      - "zsh" # shell designed for interactive use, although it is also a powerful scripting language
    casks:
      - "firefox"
      - "font-jetbrains-mono-nerd-font"
      - "ghostty"
      - "google-chrome"
      - "obsidian"
      - "raycast"
      - "rectangle"
      - "visual-studio-code"
      - "zed"
  work:
    taps: ["common-fate/granted"]
    brews:
      - "awscli"
      - "glab"
      - "keeper-commander"
      - "granted"
    casks:
      - "keeper-password-manager"
      - "slack"
